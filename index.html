<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brass Studio 2.0 - Phase 1</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="container">
<header>
<h1>Brass Studio</h1>
<p class="version">Phase 1</p>
</header>

<section class="card">
<h2>API接続状態</h2>
<p id="apiStatus">未確認</p>
</section>

<section class="card">
<h2>音源</h2>
<input id="audioFile" type="file" accept=".mp3,.wav,.m4a,audio/*">
<p id="fileName">ファイル未選択</p>
</section>

<section class="card">
<button id="uploadButton" type="button">アップロード</button>
</section>

<section class="card">
<h2>結果</h2>
<dl>
<dt>ファイル名</dt><dd id="resultFilename">-</dd>
<dt>サイズ</dt><dd id="resultSize">-</dd>
<dt>再生時間</dt><dd id="resultDuration">-</dd>
</dl>
</section>

<section class="card error">
<h2>エラー</h2>
<p id="errorMessage">なし</p>
</section>
</main>

<script src="./app.js"></script>
</body>
</html>
